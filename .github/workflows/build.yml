name: Build ownroot APK

on:
  push:
    branches: [main, master, ownroot-app]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components (API 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" > /dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (первый прогон — ловим ошибки компиляции)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ownroot-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownroot-release-unsigned
          path: app/build/outputs/apk/release/*.apk
